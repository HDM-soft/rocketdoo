# Publishes rocketdoo to PyPI when a pull request is merged into main.
#
# The whole CI suite runs first as a blocking gate: publishing is only reached
# if lint, tests, the E2E run, the build and the Odoo image matrix all pass.
# Before v3.2 this workflow ran its own checks with continue-on-error, so a
# broken package could reach PyPI unnoticed.
name: Build and Publish to PyPI

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  ci:
    # Reuses .github/workflows/ci.yml — one definition of "is this healthy?"
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml
    with:
      build-odoo-images: true
    permissions:
      contents: read

  version-check:
    name: Version is releasable
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyproject version is not already on PyPI
        # A merge to main without a version bump is the most common release
        # mistake. skip-existing keeps CI green, so it would pass silently.
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $VERSION"
          PUBLISHED=$(curl -sf https://pypi.org/pypi/rocketdoo/json | python -c "import sys,json;print(' '.join(json.load(sys.stdin)['releases']))" || echo "")
          echo "published: $PUBLISHED"
          for v in $PUBLISHED; do
            if [ "$v" = "$VERSION" ]; then
              echo "::error::Version $VERSION is already on PyPI. Bump the version in pyproject.toml, README.md and LICENSE."
              exit 1
            fi
          done
          echo "$VERSION is new — ok to publish."

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ci, version-check]
    if: github.event.pull_request.merged == true

    permissions:
      contents: read
      id-token: write  # trusted publishing

    environment:
      name: pypi
      url: https://pypi.org/project/rocketdoo/

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Avoids a red run when the version already exists (e.g. a re-merge).
          # version-check above is what catches a genuinely missing bump.
          skip-existing: true
