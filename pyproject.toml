[project]
name = "rocketdoo"
version = "3.2.0"
description = "Framework for creating Odoo development environments with Docker and custom templates."
authors = [
    { name = "Horacio Montaño", email = "horaciomontano@hdmsoft.com.ar" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.3",
    "copier>=9.2.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pyfiglet>=1.0",
    "questionary>=1.10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
rocketdoo = "rocketdoo.cli:main"
rkd = "rocketdoo.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# 🚀 Automatic package detection
[tool.setuptools.packages.find]
where = ["."]
include = ["rocketdoo*"]

# 🚀 Include templates in the package
[tool.setuptools.package-data]
rocketdoo = [
    "templates/.gitignore.jinja",
    "templates/**/*",
    "templates/**/**/*",
    "templates/**/.vscode/*",
    "templates/**/*.jinja",
    "templates/deploy/*",
    "templates/**/.*",
    "templates/**/**/.*",
    "gui/static/*",
    "gui/static/**/*",
]

[tool.setuptools]
include-package-data = true

# ─────────────────────────── Tests ───────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "docker: requires a working Docker daemon (skipped when unavailable)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["error::DeprecationWarning:rocketdoo.*"]

# ─────────────────────────── Lint ────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 127
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
# E501 (line-too-long) is pure style over 322 pre-existing lines; revisit in #137.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
