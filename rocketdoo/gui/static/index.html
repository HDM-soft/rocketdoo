<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocketdoo GUI — v3</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #07091A; color: #DDE4F0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #1C2952; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #1A3DCC; }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 224px; min-height: 100vh; background: #090D22; border-right: 1px solid #151E45; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.main { flex: 1; overflow-y: auto; }
.page { padding: 32px 36px; max-width: 1120px; }

/* Sidebar logo */
.logo-area { padding: 22px 18px 18px; border-bottom: 1px solid #151E45; display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #1A3DCC 0%, #7553C8 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 20px rgba(26,61,204,0.4); }
.logo-text { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: .02em; line-height: 1; }
.logo-sub { font-size: 10px; color: #4D6A92; text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.v3-badge { font-size: 9px; font-weight: 700; background: rgba(26,61,204,0.3); color: #6D9CFF; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }

/* Sidebar active path */
.active-path { padding: 9px 14px 10px; border-bottom: 1px solid #151E45; cursor: pointer; transition: background .15s; }
.active-path:hover { background: rgba(26,61,204,0.08); }
.active-path-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #5577A2; margin-bottom: 2px; }
.active-path-val { font-size: 11px; color: #6D9CFF; font-family: monospace; word-break: break-all; line-height: 1.4; }

/* Sidebar nav */
.nav { flex: 1; padding: 12px 10px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: #6B82A8; font-size: 13px; font-weight: 500; margin-bottom: 2px; transition: all .15s; border: 1px solid transparent; user-select: none; }
.nav-item:hover { background: rgba(26,61,204,0.1); color: #DDE4F0; }
.nav-item.active { background: rgba(26,61,204,0.18); color: #7AA3FF; border-color: rgba(26,61,204,0.3); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-sep { height: 1px; background: #151E45; margin: 8px 10px; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid #151E45; font-size: 11px; color: #4D6A92; line-height: 1.7; }

/* Cards */
.card { background: #0D1230; border: 1px solid #151E45; border-radius: 10px; padding: 20px; transition: border-color .15s; }
.card:hover { border-color: rgba(26,61,204,0.35); }
.card-flat { background: #0D1230; border: 1px solid #151E45; border-radius: 10px; overflow: hidden; }
.card-header { padding: 12px 20px; border-bottom: 1px solid #151E45; display: flex; align-items: center; justify-content: space-between; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.badge-blue   { background: rgba(26,61,204,0.22); color: #6D9CFF; }
.badge-green  { background: rgba(34,197,94,0.18);  color: #4ADE80; }
.badge-red    { background: rgba(239,68,68,0.18);  color: #F87171; }
.badge-yellow { background: rgba(245,158,11,0.18); color: #FCD34D; }
.badge-purple { background: rgba(117,83,200,0.22); color: #A78BFA; }
.badge-gray   { background: rgba(107,114,128,0.18); color: #9CA3AF; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn-primary { background: #1A3DCC; color: #fff; }
.btn-primary:hover { background: #2450E8; box-shadow: 0 0 14px rgba(26,61,204,0.45); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: #7A92BA; border: 1px solid #1A2A50; }
.btn-ghost:hover { color: #DDE4F0; border-color: rgba(26,61,204,0.5); background: rgba(26,61,204,0.1); }
.btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
.btn-danger { background: transparent; color: #F87171; border: 1px solid rgba(239,68,68,0.4); }
.btn-danger:hover { background: rgba(239,68,68,0.1); border-color: #EF4444; }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-sm svg { width: 11px; height: 11px; }

/* Status dot */
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-green  { background: #22C55E; box-shadow: 0 0 6px rgba(34,197,94,.5); }
.dot-red    { background: #EF4444; }
.dot-yellow { background: #F59E0B; }
.dot-gray   { background: #4B5563; }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.page-title { font-size: 22px; font-weight: 700; color: #DDE4F0; }
.page-sub { font-size: 13px; color: #6B82A8; margin-top: 3px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: #0D1230; border: 1px solid #151E45; border-radius: 10px; padding: 16px 18px; }
.stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #5C7498; margin-bottom: 10px; }
.stat-value { font-size: 28px; font-weight: 700; color: #DDE4F0; line-height: 1; }
.stat-note { font-size: 12px; color: #6B82A8; margin-top: 6px; }

/* Table */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; padding: 10px 18px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #5577A2; border-bottom: 1px solid #151E45; }
.table td { padding: 13px 18px; border-bottom: 1px solid #0F1830; vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(26,61,204,0.04); }

/* Log terminal */
.log-term { background: #040711; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.65; color: #7EC87E; height: 300px; overflow-y: auto; padding: 12px 14px; border-radius: 8px; border: 1px solid #0F1830; }
.log-err { color: #F87171; }
.log-warn { color: #FCD34D; }

/* Toggle */
.toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track { position: absolute; inset: 0; background: #1A2A50; border-radius: 22px; transition: .2s; cursor: pointer; }
.toggle-track::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #4B6080; border-radius: 50%; transition: .2s; }
input:checked ~ .toggle-track { background: #1A3DCC; }
input:checked ~ .toggle-track::before { transform: translateX(18px); background: #fff; }

/* Input */
.input { background: #0D1230; border: 1px solid #1A2A50; border-radius: 7px; padding: 8px 12px; color: #DDE4F0; font-size: 13px; outline: none; transition: border-color .15s; width: 100%; }
.input:focus { border-color: #1A3DCC; }

/* Animations */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .8s linear infinite; display: inline-block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn .2s ease; }

/* Notifications */
.notif-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 9999; min-width: 280px; max-width: 360px; }
.notif { padding: 11px 14px; border-radius: 8px; display: flex; align-items: center; gap: 9px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,.5); animation: fadeIn .2s ease; }
.notif-ok  { background: #081A10; border: 1px solid rgba(34,197,94,.35); }
.notif-err { background: #160808; border: 1px solid rgba(239,68,68,.35); }
.notif svg { width: 15px; height: 15px; flex-shrink: 0; }
.notif-ok svg  { color: #22C55E; }
.notif-err svg { color: #EF4444; }

/* Empty state */
.empty { text-align: center; padding: 56px 32px; }
.empty svg { width: 44px; height: 44px; color: #1A2A50; margin-bottom: 16px; }
.empty h3 { font-size: 16px; font-weight: 600; color: #5C7498; margin-bottom: 8px; }
.empty p { font-size: 13px; color: #5577A2; }
.code-block { background: #040711; border: 1px solid #0F1830; border-radius: 8px; padding: 14px 20px; display: inline-block; font-family: monospace; font-size: 13px; color: #4ADE80; text-align: left; margin-top: 20px; }

/* Project card */
.proj-card { background: #0D1230; border: 1px solid #151E45; border-radius: 10px; padding: 18px; transition: all .15s; }
.proj-card:hover { border-color: rgba(26,61,204,0.4); }
.proj-card.active-proj { border-color: rgba(26,61,204,0.55); background: rgba(26,61,204,0.05); }

/* ── Light Mode ─────────────────────────────────────────────────────────── */
html.light body { background: #C8D4E2; color: #0A1528; }
html.light .page-title { color: #0A1528; }
html.light .page-sub   { color: #1E3A58; }
/* Nav items inside dark sidebar keep their dark-mode colors — no override needed */
html.light .btn-ghost  { color: #1E3558; border-color: #6A88B0; }
html.light .btn-ghost:hover { color: #0A1528; background: rgba(26,61,204,0.12); border-color: rgba(26,61,204,0.4); }
html.light .btn-ghost:disabled { color: #3A5880; }
/* Sidebar stays dark: logo-sub, active-path-label, sidebar-footer use same colors */
html.light ::-webkit-scrollbar-track { background: #B2C0D5; }
html.light ::-webkit-scrollbar-thumb { background: #7A8EAA; }
html.light ::-webkit-scrollbar-thumb:hover { background: #4A6080; }
</style>
</head>

<script>
const { createApp, ref, computed, onMounted, onActivated, onUnmounted, watch, nextTick } = Vue

/* ── API ─────────────────────────────────────────────────────────────────── */
const api = {
  async get(p) { const r = await fetch('/api'+p); return r.json() },
  async post(p, b={}) {
    const r = await fetch('/api'+p, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b) })
    return r.json()
  }
}

/* ── Module-level reactive state ─────────────────────────────────────────── */
const notifs = ref([])
const currentPath = ref('')
const view = ref('projects')

let _nid = 0
function notify(msg, type='ok') {
  const id = ++_nid
  notifs.value.push({ id, msg, type })
  setTimeout(() => { notifs.value = notifs.value.filter(n=>n.id!==id) }, 4500)
}

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function cstatus(s) {
  const v = (s||'').toLowerCase()
  if (v.includes('running')||v.includes(' up')) return 'running'
  if (v.includes('exited')||v.includes('stopped')) return 'stopped'
  if (v.includes('paused')) return 'paused'
  return 'unknown'
}
function dotClass(s) {
  const m = {running:'dot-green', stopped:'dot-red', paused:'dot-yellow'}
  return m[cstatus(s)] || 'dot-gray'
}

/* ══════════════════════════════════════════════════════════════════════════
   LOG VIEWER COMPONENT
══════════════════════════════════════════════════════════════════════════ */
const LogViewer = {
  props: { name: String },
  setup(props) {
    const lines = ref([])
    const live  = ref(false)
    const el    = ref(null)
    let ws      = null
    let pending = []
    let raf     = null

    function lineClass(l) {
      const lc = l.toLowerCase()
      if (/error|traceback|exception|critical/.test(lc)) return 'log-err'
      if (/warn/.test(lc)) return 'log-warn'
      return ''
    }

    function flush() {
      raf = null
      if (!pending.length) return
      lines.value.push(...pending.splice(0))
      if (lines.value.length > 1500) lines.value.splice(0, lines.value.length - 1300)
      nextTick(() => { if (el.value) el.value.scrollTop = el.value.scrollHeight })
    }

    function connect() {
      if (ws) ws.close()
      if (raf) { cancelAnimationFrame(raf); raf = null }
      pending = []
      lines.value = []
      live.value = true
      const proto = location.protocol==='https:'?'wss':'ws'
      ws = new WebSocket(`${proto}://${location.host}/ws/logs/${props.name}`)
      ws.onmessage = e => {
        pending.push(e.data)
        if (!raf) raf = requestAnimationFrame(flush)
      }
      ws.onclose = () => {
        live.value = false
        if (raf) { cancelAnimationFrame(raf); raf = null }
        if (pending.length) flush()
      }
      ws.onerror = () => { live.value = false; lines.value.push('[connection error]') }
    }
    function stop() {
      if (raf) { cancelAnimationFrame(raf); raf = null }
      if (ws) ws.close()
      live.value = false
    }

    onMounted(connect)
    onUnmounted(stop)
    watch(() => props.name, connect)

    return { lines, live, el, connect, stop, lineClass, I }
  },
  template: `
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:12px;font-weight:600;color:#DDE4F0;">{{ name }}</span>
        <span v-if="live" style="display:flex;align-items:center;gap:5px;font-size:11px;color:#22C55E;">
          <span class="dot dot-green" style="width:6px;height:6px;"></span> Live
        </span>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button @click="live?stop():connect()" class="btn btn-ghost btn-sm" v-html="(live?I.stop:I.play)+' '+(live?'Stop':'Connect')"></button>
          <button @click="lines=[]" class="btn btn-ghost btn-sm">Clear</button>
        </div>
      </div>
      <div ref="el" class="log-term">
        <div v-if="!lines.length" style="color:#5577A2;font-style:italic;">Waiting for output…</div>
        <div v-for="(l,i) in lines" :key="i" :class="lineClass(l)">{{ l }}</div>
      </div>
    </div>
  `
}

/* ══════════════════════════════════════════════════════════════════════════
   DOCKER TERMINAL — streaming WebSocket output for compose commands
══════════════════════════════════════════════════════════════════════════ */
const DockerTerminal = {
  props: { action: String },
  emits: ['done', 'close'],
  setup(props, { emit }) {
    const lines    = ref([])
    const running  = ref(true)
    const exitCode = ref(null)
    const el       = ref(null)
    let ws      = null
    let pending = []   // non-reactive line buffer
    let raf     = null // requestAnimationFrame handle

    // Flush the buffer into reactive state in one batch — max 60 updates/sec
    function flush() {
      raf = null
      if (!pending.length) return
      lines.value.push(...pending.splice(0))
      if (lines.value.length > 2000) lines.value.splice(0, lines.value.length - 1700)
      nextTick(() => { if (el.value) el.value.scrollTop = el.value.scrollHeight })
    }

    onMounted(() => {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws'
      ws = new WebSocket(`${proto}://${location.host}/ws/docker/${props.action}`)
      ws.onmessage = e => {
        const txt = e.data
        if (txt.startsWith('\x00exit:')) {
          // Drain any buffered lines before showing the exit banner
          if (raf) { cancelAnimationFrame(raf); raf = null }
          if (pending.length) flush()
          exitCode.value = parseInt(txt.slice(6))
          running.value  = false
          emit('done', exitCode.value)
        } else {
          if (txt.trim()) pending.push(txt)
          if (!raf) raf = requestAnimationFrame(flush)
        }
      }
      ws.onclose = () => {
        running.value = false
        if (raf) { cancelAnimationFrame(raf); raf = null }
        if (pending.length) flush()
      }
      ws.onerror = () => {
        running.value = false
        lines.value.push('[WebSocket error — is the server running?]')
      }
    })
    onUnmounted(() => {
      if (raf) cancelAnimationFrame(raf)
      if (ws) ws.close()
    })

    function lineClass(l) {
      const lc = l.toLowerCase()
      if (/\berror\b|failed|traceback|exception|no such/.test(lc)) return 'log-err'
      if (/\bwarn(ing)?\b/.test(lc)) return 'log-warn'
      return ''
    }

    return { lines, running, exitCode, el, lineClass, I }
  },
  template: `
    <div class="card-flat" style="border-color:rgba(26,61,204,0.2);">
      <div style="display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid #151E45;background:#090D22;">
        <span v-if="running" v-html="I.spin" class="spin" style="width:13px;height:13px;color:#6D9CFF;display:inline-block;flex-shrink:0;"></span>
        <span v-else-if="exitCode===0" v-html="I.check" style="width:13px;height:13px;color:#22C55E;flex-shrink:0;"></span>
        <span v-else v-html="I.warn" style="width:13px;height:13px;color:#F87171;flex-shrink:0;"></span>
        <code style="font-size:12px;color:#DDE4F0;flex:1;font-family:monospace;">docker compose {{ action }}</code>
        <span v-if="running" style="font-size:11px;color:#6B82A8;">running…</span>
        <span v-else-if="exitCode===0" style="font-size:11px;color:#22C55E;">✓ completed</span>
        <span v-else style="font-size:11px;color:#F87171;">✗ exit {{ exitCode }}</span>
        <button @click="$emit('close')" class="btn btn-ghost btn-sm" style="padding:2px 8px;margin-left:8px;" title="Close terminal">✕</button>
      </div>
      <div ref="el" class="log-term" style="height:320px;">
        <div v-if="!lines.length" style="color:#5577A2;font-style:italic;">Connecting to docker compose {{ action }}…</div>
        <div v-for="(l,i) in lines" :key="i" :class="lineClass(l)">{{ l }}</div>
      </div>
    </div>
  `
}

const Modules = {
  setup() {
    // ── Local addons ─────────────────────────────────────────────────────
    const mods     = ref([])
    const busy     = ref(true)
    const all      = ref(false)
    const q        = ref('')
    const filtered = computed(() => mods.value.filter(m =>
      !q.value || m.name.toLowerCase().includes(q.value.toLowerCase())
    ))

    async function load() {
      busy.value = true
      try {
        const r = await api.get('/modules?include_all='+all.value)
        mods.value = r.modules || []
        if (r.error) notify('Scan: '+r.error, 'err')
      } catch(e) { notify('Scan failed','err') }
      finally { busy.value = false }
      loadGitman()
    }

    // ── Gitman repos ──────────────────────────────────────────────────────
    const gitSources  = ref([])
    const gitOriginal = ref([])
    const gitExists   = ref(false)
    const gitBusy     = ref(false)
    const gitSaving   = ref(false)
    const rebuildBusy = ref(false)
    const gitForm     = ref(null)
    const gitDirty    = computed(() =>
      JSON.stringify(gitSources.value) !== JSON.stringify(gitOriginal.value)
    )

    async function loadGitman() {
      gitBusy.value = true
      try {
        const r = await api.get('/gitman')
        gitExists.value   = r.exists || false
        gitSources.value  = r.sources || []
        gitOriginal.value = JSON.parse(JSON.stringify(r.sources || []))
      } catch {}
      finally { gitBusy.value = false }
    }

    async function initGitman() {
      gitSaving.value = true
      try {
        const r = await api.post('/gitman', { sources: [] })
        if (r.ok) {
          gitExists.value   = true
          gitOriginal.value = []
          notify('gitman.yaml created')
        } else notify(r.error || 'Could not create gitman.yaml', 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { gitSaving.value = false }
    }

    function addGitRepo() {
      gitForm.value = { idx: -1, name: '', repo: '', rev: '18.0', type: 'git' }
    }

    }

      }

      if (f.idx === -1) { gitSources.value.push(entry) }
      else              { gitSources.value[f.idx] = entry }

    }
    async function saveGitman() {
      gitSaving.value = true

      finally { gitSaving.value = false }

      } catch(e) { notify(e.message,'err') }
      finally { rebuildBusy.value = false }
    }

    watch(all, load)
    onActivated(load)

      dep.value[env] = true
      try {
        const r = await api.post('/instances/deploy', { env, dry_run: !!dry.value[env] })
        if (r.ok) notify(env+' deploy '+(dry.value[env]?'(dry-run) ':'')+'completed')
        else notify(r.error||'Deploy failed','err')
      } catch(e) { notify(e.message,'err') }
      finally { dep.value[env] = false }
    }

    onActivated(load)
    return { inst, busy, dep, dry, load, deploy, I }
  },

const Deploy = {
  setup() {
    const targets    = ref([])
    const busy       = ref(true)
    const depBusy    = ref({})
    const valBusy    = ref(false)
    const validation = ref(null)
    const output     = ref('')
    const hasConfig  = ref(false)
    const initForm   = ref({ target_name:'production', target_type:'vps', host:'', user:'ubuntu', ssh_port:22, ssh_key:'', deployment_type:'docker', force:false })
    const initBusy   = ref(false)

    async function load() {
      busy.value = true
      try {
        const [t,c] = await Promise.all([api.get('/deploy/targets'), api.get('/deploy/config')])
        targets.value = t.targets||[]; hasConfig.value = c.exists
      } catch { notify('Load failed','err') }
      finally { busy.value = false }
    }
    async function deployTarget(target, dry_run=false) {
      const k = target+dry_run; depBusy.value[k] = true; output.value = ''
      try {
        const r = await api.post('/deploy/run', { target, dry_run, modules:[], skip_backup:false, skip_validation:false })
        output.value = r.ok ? '✓ '+(dry_run?'[dry-run] ':'')+'Deploy done.\n'+(r.result||r.message||'') : '✗ '+r.error
        r.ok ? notify((dry_run?'Dry run':'Deploy')+' '+target+' done') : notify(r.error||'Failed','err')
      } catch(e) { notify(e.message,'err'); output.value = '✗ '+e.message }
      finally { delete depBusy.value[k] }
    }
    async function validate() {
      valBusy.value = true; validation.value = null
      try {
        const r = await api.post('/deploy/validate')
        validation.value = r
        r.ok ? notify('All '+r.total+' modules valid') : notify('Validation errors found','err')
      } catch(e) { notify(e.message,'err') }
      finally { valBusy.value = false }
    }
    async function initDeploy() {
      initBusy.value = true
      try {
        const r = await api.post('/deploy/init', { ...initForm.value, ssh_port: Number(initForm.value.ssh_port) })
        if (r.ok) { notify('deploy.yaml created'); await load() }
        else notify(r.error||'Failed','err')
      } catch(e) { notify(e.message,'err') }
      finally { initBusy.value = false }
    }
    onActivated(load)
    return { targets, busy, depBusy, valBusy, validation, output, hasConfig, initForm, initBusy, load, deployTarget, validate, initDeploy, I }
  },
  template: `
  <div class="page fade-in">
    <div class="page-header">
      <div><div class="page-title">Deploy</div><div class="page-sub">Deploy Odoo modules to configured VPS targets</div></div>

        <button class="btn btn-ghost" @click="validate" :disabled="valBusy">
          <span v-html="valBusy?I.spin:I.check" :class="valBusy?'spin':''"></span> Validate Modules
        </button>
        <button class="btn btn-ghost" @click="load" :disabled="busy">
          <span v-html="I.refresh" :class="busy?'spin':''"></span> Refresh
        </button>
      </div>
    </div>

    <div v-if="validation" class="card" :style="{borderColor:validation.ok?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)',marginBottom:'20px'}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span v-html="validation.ok?I.check:I.warn" :style="{width:'16px',height:'16px',color:validation.ok?'#22C55E':'#F87171',flexShrink:0}"></span>
        <span style="font-size:14px;font-weight:600;color:#DDE4F0;">{{ validation.ok ? 'All '+validation.total+' modules valid' : 'Validation errors' }}</span>
      </div>
      <div v-if="!validation.ok" style="font-size:12px;color:#F87171;">
        <div v-for="(errs,mod) in validation.errors" :key="mod" style="margin-bottom:3px;">
          <span style="color:#FCD34D;font-family:monospace;">{{ mod }}</span>: <span v-for="e in errs" :key="e">{{ e }} </span>
        </div>

    <div v-if="busy" style="text-align:center;padding:80px 0;color:#6B82A8;">
      <span v-html="I.spin" class="spin" style="width:26px;height:26px;display:inline-block;"></span>
    </div>

    <template v-else>
      <div v-if="!hasConfig" class="card" style="max-width:600px;margin-bottom:20px;">
        <div style="font-size:14px;font-weight:700;color:#DDE4F0;margin-bottom:14px;display:flex;align-items:center;gap:8px;">
          <span v-html="I.deploy" style="width:16px;height:16px;color:#1A3DCC;flex-shrink:0;"></span> Create Deploy Config
        </div>
        <div style="font-size:12px;color:#6B82A8;margin-bottom:14px;">Creates <code style="color:#6D9CFF;">.rkd/deploy.yaml</code> with your VPS target configuration.</div>
        <div style="display:grid;gap:11px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div><label style="font-size:12px;color:#6B82A8;display:block;margin-bottom:4px;">Target name</label>

            <div><label style="font-size:12px;color:#6B82A8;display:block;margin-bottom:4px;">Type</label>
              <select v-model="initForm.target_type" class="input"><option value="vps">vps — self-hosted Linux server</option><option value="odoo-sh">odoo-sh — Odoo.sh platform</option></select></div>

          <div style="display:grid;grid-template-columns:1fr 80px;gap:10px;">

            <div><label style="font-size:12px;color:#6B82A8;display:block;margin-bottom:4px;">SSH Port</label>

              <select v-model="initForm.deployment_type" class="input"><option value="docker">docker</option><option value="native">native</option></select></div>
          </div>
          <div><label style="font-size:12px;color:#6B82A8;display:block;margin-bottom:4px;">SSH Key path</label>
            <input v-model="initForm.ssh_key" class="input" placeholder="~/.ssh/id_rsa — leave empty to use ssh-agent" /></div>
        </div>
        <div style="margin-top:14px;border-top:1px solid #151E45;padding-top:12px;">
          <button @click="initDeploy" class="btn btn-primary" :disabled="initBusy">
            <span v-html="initBusy?I.spin:I.play" :class="initBusy?'spin':''"></span>
            {{ initBusy ? 'Creating…' : 'Create deploy.yaml' }}
          </button>
        </div>
      </div>

      <div v-else-if="!targets.length" class="card empty" style="border-style:dashed;">
        <div v-html="I.deploy"></div>
        <h3>No deploy targets found</h3>
        <p>Add targets to <code style="color:#6D9CFF;">.rkd/deploy.yaml</code></p>
      </div>

      <div v-else style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-bottom:20px;">
        <div v-for="t in targets" :key="t.name" class="card" style="border-color:rgba(26,61,204,0.3);">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;">
            <span v-html="I.deploy" style="width:17px;height:17px;color:#1A3DCC;flex-shrink:0;"></span>
            <span style="font-size:15px;font-weight:700;color:#DDE4F0;">{{ t.name }}</span>
            <span class="badge badge-blue" style="margin-left:auto;">{{ t.type }}</span>
          </div>
          <div style="font-size:12px;margin-bottom:14px;">

}

const Pack = {
  setup() {
    const status     = ref({ project_exists: false, shared_json_found: false })
    const packForm   = ref({ include_db: true, output_path: '', db_name: '' })
    const packBusy   = ref(false)
    const unpackBusy = ref(false)
    const output     = ref('')
    const busy       = ref(true)

    async function load() {
      busy.value = true
      try { const r = await api.get('/pack/status'); status.value = r }
      catch {} finally { busy.value = false }
    }
    async function pack() {
      packBusy.value = true; output.value = ''
      try {
        const body = { include_db: packForm.value.include_db }
        if (packForm.value.output_path) body.output_path = packForm.value.output_path
        if (packForm.value.db_name) body.db_name = packForm.value.db_name
        const r = await api.post('/pack/pack', body)
        output.value = [r.stdout, r.stderr].filter(Boolean).join('\n')
        r.ok ? notify('Pack completed') : notify(r.stderr||'Pack failed','err')
        if (r.ok) await load()
      } finally { packBusy.value = false }
    }
    async function unpack() {
      unpackBusy.value = true; output.value = ''
      try {
        const r = await api.post('/pack/unpack')
        output.value = [r.stdout, r.stderr].filter(Boolean).join('\n')
        r.ok ? notify('Unpack completed') : notify(r.stderr||'Unpack failed','err')
      } finally { unpackBusy.value = false }
    }
    onActivated(load)
    return { status, packForm, packBusy, unpackBusy, output, busy, pack, unpack, I }
  },

/* ══════════════════════════════════════════════════════════════════════════
   PROJECTS — Discover, navigate & create Rocketdoo projects
══════════════════════════════════════════════════════════════════════════ */
const Projects = {
  setup() {
    const projects   = ref([])
    const busy       = ref(false)
    const scanDir    = ref('')
    const newName    = ref('')
    const createBusy = ref(false)
    const navBusy    = ref({})
    const editing    = ref(false)
    const customPath = ref('')
    const scanned    = ref(false)

    async function loadWorkspace() {
      try {
        const r = await api.get('/workspace')
        currentPath.value = r.path
        customPath.value = r.path
        if (!scanDir.value) scanDir.value = r.default_scan
      } catch {}
    }

    async function discover() {
      busy.value = true; scanned.value = false
      try {
        const r = await api.post('/workspace/discover', { base_dir: scanDir.value, max_depth: 3 })
        projects.value = r.projects || []
        scanned.value = true
        if (r.error) notify(r.error, 'err')
        else if (r.total > 0) notify('Found ' + r.total + ' project' + (r.total !== 1 ? 's' : ''))
        else notify('No Rocketdoo projects found in ' + r.base_dir, 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { busy.value = false }
    }

    async function navigate(path) {
      navBusy.value[path] = true
      try {
        const r = await api.post('/workspace/navigate', { path })
        if (r.ok) {
          currentPath.value = r.path
          customPath.value = r.path
          projects.value = projects.value.map(p => ({ ...p, is_current: p.path === r.path }))
          notify('Project "' + r.name + '" opened — switching to Dashboard')
          setTimeout(() => { view.value = 'dashboard' }, 400)
        } else notify(r.error || 'Failed to open project', 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { navBusy.value[path] = false }
    }

    async function navigateCustom() {
      if (!customPath.value.trim()) return
      editing.value = false
      await navigate(customPath.value.trim())
    }

    async function createProject() {
      const name = newName.value.trim()
      if (!name) { notify('Project name required', 'err'); return }
      createBusy.value = true
      try {
        const mkr = await api.post('/workspace/mkdir', { name, base_dir: scanDir.value })
        if (!mkr.ok) { notify(mkr.error || 'Failed to create directory', 'err'); return }
        const navr = await api.post('/workspace/navigate', { path: mkr.path })
        if (navr.ok) { currentPath.value = navr.path; customPath.value = navr.path }
        notify('Created ' + mkr.name + ' — opening Setup…')
        newName.value = ''
        // Small delay so the notify is visible before switching
        setTimeout(() => { view.value = 'setup' }, 600)
      } catch(e) { notify(e.message, 'err') }
      finally { createBusy.value = false }
    }

    onMounted(async () => {
      await loadWorkspace()
      discover()
    })

    return {
      projects, busy, scanDir, newName, createBusy, navBusy,
      editing, customPath, scanned, currentPath,
      navigate, navigateCustom, createProject, discover, I
    }
  },
  template: `

    <!-- ── Active project directory ──────────────────────────────────────── -->
    <div style="margin-bottom:24px;">

    <template v-else>
      <div v-if="scanned && !projects.length" class="card empty" style="border-style:dashed;">

      <div v-else-if="projects.length">

        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">
          <div v-for="p in projects" :key="p.path"
               class="proj-card" :class="{ 'active-proj': p.is_current }">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
              <div style="flex:1;min-width:0;">

                  <span v-html="I.folder" style="width:15px;height:15px;color:#1A3DCC;flex-shrink:0;"></span>

          <span style="font-size:13px;font-weight:700;color:#DDE4F0;">Services</span>

        <p style="font-size:12px;color:#6B82A8;line-height:1.55;margin-bottom:10px;"><b style="color:#DDE4F0;">Mailpit</b> — toggle an SMTP testing server. Odoo sends emails to it instead of a real server; open <code style="color:#6D9CFF;font-size:11px;">localhost:8025</code> to inspect them. <b style="color:#DDE4F0;">Traefik</b> — configure a reverse proxy with local or production HTTPS, and get instructions to update your hosts file.</p>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5577A2;margin-bottom:5px;">Equivalents</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd mail on/off</code>
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd traefik on/off</code>
        </div>
      </div>

      <!-- Deploy -->
      <div class="card" style="padding:16px 18px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span v-html="I.deploy" style="width:15px;height:15px;color:#6D9CFF;flex-shrink:0;"></span>
          <span style="font-size:13px;font-weight:700;color:#DDE4F0;">Deploy</span>
        </div>
        <p style="font-size:12px;color:#6B82A8;line-height:1.55;margin-bottom:10px;">Deploy specific Odoo <b style="color:#DDE4F0;">modules</b> (not the full instance) to a configured VPS or Odoo.sh target. First configure a target with <b style="color:#DDE4F0;">Init</b>, then select modules and run a deployment. Supports dry-run, backups, and validation before pushing.</p>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5577A2;margin-bottom:5px;">Equivalents</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd deploy init</code>
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd deploy run -t prod</code>
        </div>
      </div>

      <!-- Pack -->
      <div class="card" style="padding:16px 18px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span v-html="I.pack" style="width:15px;height:15px;color:#6D9CFF;flex-shrink:0;"></span>
          <span style="font-size:13px;font-weight:700;color:#DDE4F0;">Pack</span>
        </div>
        <p style="font-size:12px;color:#6B82A8;line-height:1.55;margin-bottom:10px;">Create a portable ZIP of the entire environment — source code, database dump, and filestore — to share with a teammate. The recipient extracts the ZIP and runs <b style="color:#DDE4F0;">Unpack</b> to restore it with a single command. SSH keys are never included in the archive.</p>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5577A2;margin-bottom:5px;">Equivalents</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd pack</code>
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd unpack</code>
        </div>
      </div>

      <!-- Setup -->
      <div class="card" style="padding:16px 18px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span v-html="I.setup" style="width:15px;height:15px;color:#6D9CFF;flex-shrink:0;"></span>
          <span style="font-size:13px;font-weight:700;color:#DDE4F0;">Setup</span>
        </div>
        <p style="font-size:12px;color:#6B82A8;line-height:1.55;margin-bottom:10px;"><b style="color:#DDE4F0;">Scaffold</b> copies the base template files (Dockerfile, docker-compose, odoo.conf…) into the current directory. <b style="color:#DDE4F0;">Init Wizard</b> walks you through choosing the Odoo version, edition, ports, SSH keys, and third-party repos, then renders all templates.</p>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5577A2;margin-bottom:5px;">Equivalents</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd scaffold</code>
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd init</code>
          <code style="font-size:11px;color:#4ADE80;background:#040711;border:1px solid #0F1830;border-radius:5px;padding:3px 8px;font-family:monospace;">rkd info</code>
        </div>
      </div>

    </div><!-- /grid -->

    <!-- ── CLI Quick Reference ────────────────────────────────────────────── -->
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#5577A2;margin-bottom:12px;">CLI Quick Reference</div>
    <div class="card-flat" style="margin-bottom:8px;">
      <table class="table">
        <thead>
          <tr>
            <th style="width:38%;">Command</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="([cmd,desc],i) in [
            ['rkd scaffold',                    'Copy base template files into the current directory'],
            ['rkd init',                        'Interactive wizard — Dockerfile, docker-compose, odoo.conf'],
            ['rkd info',                        'Display current project configuration in tables'],
            ['rkd up -d',                       'Start all containers in detached mode'],
            ['rkd down [-v]',                   'Stop and remove containers (optionally delete volumes)'],
            ['rkd restart',                     'Restart all services'],
            ['rkd build --rebuild',             'Rebuild Docker image and restart'],
            ['rkd status',                      'Show container status (docker compose ps)'],
            ['rkd stop',                        'Stop containers without removing them'],
            ['rkd logs [service] -f',           'Stream container logs (live follow)'],
            ['rkd mail on / off / status',      'Toggle Mailpit SMTP testing server'],
            ['rkd mail open',                   'Open Mailpit web UI at localhost:8025'],
            ['rkd traefik on / off / status',   'Toggle Traefik reverse proxy'],
            ['rkd traefik guide',               'Show /etc/hosts setup instructions'],
            ['rkd deploy init',                 'Configure module deployment targets'],
            ['rkd deploy list-modules',         'Scan and list Odoo modules in addons/'],
            ['rkd deploy run -t TARGET',        'Deploy modules to a configured target'],
            ['rkd deploy validate',             'Validate modules before deployment'],
            ['rkd instance init',               'Configure stage/prod VPS environments'],
            ['rkd instance deploy --env STAGE', 'Deploy full Odoo instance to VPS'],
            ['rkd instance status',             'Show configured deployment environments'],
            ['rkd pack',                        'Package environment (code + DB) as a ZIP'],
            ['rkd unpack',                      'Restore an environment from a ZIP'],
            ['rkd del -i',                      'Remove .Identifier files generated by WSL2'],
          ]" :key="i">
            <td style="font-family:monospace;font-size:12px;color:#6D9CFF;white-space:nowrap;">{{ cmd }}</td>
            <td style="font-size:12px;color:#6B82A8;">{{ desc }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="text-align:center;padding:16px 0 4px;font-size:12px;color:#5577A2;">
      Run <code style="color:#6D9CFF;font-size:11px;background:#040711;border:1px solid #0F1830;border-radius:4px;padding:2px 7px;">rkd --help</code> or
      <code style="color:#6D9CFF;font-size:11px;background:#040711;border:1px solid #0F1830;border-radius:4px;padding:2px 7px;">rkd &lt;command&gt; --help</code>
      for full option details in the terminal.
    </div>
  </div>`
}

/* ══════════════════════════════════════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════════════════════════════════════ */
const App = {
  components: { Projects, Dashboard, Containers, Modules, Instances, Services, Setup, Deploy, Pack, Help },
  setup() {
    const nav = [
      { id:'projects',   label:'Projects',   icon: I.compass    },
      { id:'dashboard',  label:'Dashboard',  icon: I.dashboard  },
      { id:'containers', label:'Containers', icon: I.containers },
      { id:'modules',    label:'Modules',    icon: I.modules    },
      { id:'instances',  label:'Instances',  icon: I.instances  },
      { id:'services',   label:'Services',   icon: I.services   },
      { id:'deploy',     label:'Deploy',     icon: I.deploy     },
      { id:'setup',      label:'Setup',      icon: I.setup      },
      { id:'pack',       label:'Pack',       icon: I.pack       },
      { id:'help',       label:'Help',       icon: I.help       },
    ]
    const viewMap = {
      projects:'Projects', dashboard:'Dashboard', containers:'Containers',
      modules:'Modules', instances:'Instances', services:'Services',
      deploy:'Deploy', setup:'Setup', pack:'Pack', help:'Help'
    }

    const darkMode = ref(localStorage.getItem('rkd-theme') !== 'light')
    function toggleTheme() {
      darkMode.value = !darkMode.value
      localStorage.setItem('rkd-theme', darkMode.value ? 'dark' : 'light')
      document.documentElement.classList.toggle('light', !darkMode.value)
    }

    async function init() {
      try {
        const r = await api.get('/workspace')
        currentPath.value = r.path
      } catch {}
    }

    onMounted(() => {
      if (!darkMode.value) document.documentElement.classList.add('light')
      init()
    })
    return { view, nav, notifs, I, viewMap, currentPath, darkMode, toggleTheme }
  },
  template: `
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon">
          <span v-html="I.rocket" style="width:18px;height:18px;color:white;"></span>
        </div>
        <div>
          <div class="logo-text">RKD <span class="v3-badge">v3</span></div>
          <div class="logo-sub">Rocketdoo</div>
        </div>
      </div>

      <!-- Active path pill -->
      <div v-if="currentPath" class="active-path" @click="view='projects'" title="Click to manage projects">
        <div class="active-path-label">Working Dir</div>
        <div class="active-path-val">{{ currentPath.split('/').slice(-2).join('/') || currentPath }}</div>
      </div>

      <nav class="nav">
        <div v-for="n in nav" :key="n.id"
             class="nav-item" :class="{ active: view===n.id }"
             @click="view=n.id">
          <span v-html="n.icon"></span>
          {{ n.label }}
        </div>
      </nav>

      <div class="sidebar-footer">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <span style="color:#4D6A92;">Rocketdoo GUI v3.0.0</span>
          <button @click="toggleTheme" class="btn btn-ghost btn-sm"
                  :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
                  style="padding:3px 8px;border-radius:6px;">
            <span v-html="darkMode ? I.sun : I.moon" style="width:14px;height:14px;display:block;"></span>
          </button>
        </div>
        <a href="https://rkd-docs.readthedocs.io" target="_blank"
           style="color:#1A3DCC;text-decoration:none;font-size:11px;display:inline-flex;align-items:center;gap:4px;">
          <span v-html="I.ext" style="width:10px;height:10px;"></span> Documentation
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <keep-alive>
        <component :is="viewMap[view]||'Projects'"></component>
      </keep-alive>
    </main>

    <!-- Notifications -->
    <div class="notif-wrap">
      <div v-for="n in notifs" :key="n.id" class="notif" :class="n.type==='err'?'notif-err':'notif-ok'">
        <span v-html="n.type==='err'?I.warn:I.check"></span>
        {{ n.msg }}
      </div>
    </div>
  </div>`
}

createApp(App).mount('#app')
</script>
</body>
