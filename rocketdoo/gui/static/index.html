<style>
:root {
  color-scheme: light dark;
  --b: #F4F7FC; --s: #FFFFFF; --ln: #DCE3F0; --ln2: #7590C6; --term-b: #040711; --term-t: #4ADE80; --term-ln: #0F1830;
  --tx: #0F1729; --mu: #51607B; --su: #5E6B82;
  --br: #1A3DCC; --br-h: #1531A6; --on-br: #FFFFFF; --lk: #1A3DCC;
  --ok: #126E35; --ok-bg: #E3F5EA; --wn: #84570A; --er: #B91C1C; --er-bg: #FBEAEA;
  --gy: #4B5563; --pu: #6D28D9;
  --br-rgb: 26,61,204; --ok-rgb: 18,110,53; --wn-rgb: 132,87,10; --er-rgb: 185,28,28;
  --pu-rgb: 109,40,217; --gy-rgb: 75,85,99; --sd-rgb: 0,0,0;
}
:root[data-theme="light"] { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--b); color: var(--tx); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ln2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--br); }

/* Layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 224px; min-height: 100vh; background: var(--s); border-right: 1px solid var(--ln); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
.main { flex: 1; overflow-y: auto; }
.page { padding: 32px 36px; max-width: 1120px; }

/* Top bar (RF11: permanent project context on every screen) */
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 12px 36px; background: var(--b); border-bottom: 1px solid var(--ln); }
.topbar-context { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.topbar-name { font-size: 13px; font-weight: 700; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Sidebar logo */
.logo-area { padding: 22px 18px 18px; border-bottom: 1px solid var(--ln); display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--br) 0%, var(--pu) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 20px rgba(var(--br-rgb),0.4); }
.logo-text { font-size: 16px; font-weight: 800; color: var(--tx); letter-spacing: .02em; line-height: 1; }
.logo-sub { font-size: 10px; color: var(--su); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.v3-badge { font-size: 9px; font-weight: 700; background: rgba(var(--br-rgb),0.3); color: var(--lk); padding: 1px 5px; border-radius: 4px; margin-left: 4px; }

/* Sidebar active path */
.active-path { display: block; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--ln); font: inherit; color: inherit; text-align: left; padding: 9px 14px 10px; cursor: pointer; transition: background .15s; }
.active-path:hover { background: rgba(var(--br-rgb),0.08); }
.active-path-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--su); margin-bottom: 2px; }
.active-path-val { font-size: 11px; color: var(--lk); font-family: monospace; word-break: break-all; line-height: 1.4; }

/* Sidebar nav */
.nav { flex: 1; padding: 12px 10px; }
.nav-group-label { padding: 14px 12px 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--su); }
.nav-group-label:first-child { padding-top: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; background: none; font-family: inherit; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--mu); font-size: 13px; font-weight: 500; margin-bottom: 2px; transition: all .15s; border: 1px solid transparent; user-select: none; }
.nav-item:hover { background: rgba(var(--br-rgb),0.1); color: var(--tx); }
.nav-item.active { background: rgba(var(--br-rgb),0.18); color: var(--lk); border-color: rgba(var(--br-rgb),0.3); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-count { font-size: 10px; font-weight: 700; background: rgba(var(--br-rgb),0.18); color: var(--lk); padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
.nav-sep { height: 1px; background: var(--ln); margin: 8px 10px; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--ln); font-size: 11px; color: var(--su); line-height: 1.7; }

/* Cards */
.card { background: var(--s); border: 1px solid var(--ln); border-radius: 10px; padding: 20px; transition: border-color .15s; }
.card:hover { border-color: rgba(var(--br-rgb),0.35); }
.card-flat { background: var(--s); border: 1px solid var(--ln); border-radius: 10px; overflow: hidden; }
.card-header { padding: 12px 20px; border-bottom: 1px solid var(--ln); display: flex; align-items: center; justify-content: space-between; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.badge-blue   { background: rgba(var(--br-rgb),0.22); color: var(--lk); }
.badge-green  { background: rgba(var(--ok-rgb),0.18);  color: var(--ok); }
.badge-red    { background: rgba(var(--er-rgb),0.18);  color: var(--er); }
.badge-yellow { background: rgba(var(--wn-rgb),0.18); color: var(--wn); }
.badge-purple { background: rgba(var(--pu-rgb),0.22); color: var(--pu); }
.badge-gray   { background: rgba(var(--gy-rgb),0.18); color: var(--gy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; }
.btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.btn-primary { background: var(--br); color: var(--on-br); }
.btn-primary:hover { background: var(--br-h); box-shadow: 0 0 14px rgba(var(--br-rgb),0.45); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--mu); border: 1px solid var(--ln2); }
.btn-ghost:hover { color: var(--tx); border-color: rgba(var(--br-rgb),0.5); background: rgba(var(--br-rgb),0.1); }
.btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
.btn-danger { background: transparent; color: var(--er); border: 1px solid rgba(var(--er-rgb),0.4); }
.btn-danger:hover { background: rgba(var(--er-rgb),0.1); border-color: var(--er); }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-sm svg { width: 11px; height: 11px; }

/* Status dot */
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-green  { background: var(--ok); box-shadow: 0 0 6px rgba(var(--ok-rgb),.5); }
.dot-red    { background: var(--er); }
.dot-yellow { background: var(--wn); }
.dot-gray   { background: var(--gy); }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.page-title { font-size: 22px; font-weight: 700; color: var(--tx); }
.page-sub { font-size: 13px; color: var(--mu); margin-top: 3px; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--s); border: 1px solid var(--ln); border-radius: 10px; padding: 16px 18px; }
.stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--su); margin-bottom: 10px; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--tx); line-height: 1; }
.stat-note { font-size: 12px; color: var(--mu); margin-top: 6px; }

/* Table */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; padding: 10px 18px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--su); border-bottom: 1px solid var(--ln); white-space: nowrap; }
.table td { padding: 13px 18px; border-bottom: 1px solid var(--ln); vertical-align: middle; }
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: rgba(var(--br-rgb),0.04); }

/* Log terminal */
.log-term { background: var(--term-b); font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.65; color: #7EC87E; height: 300px; overflow-y: auto; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--term-ln); }
.log-err { color: #F87171; }
.log-warn { color: #FCD34D; }

/* Toggle */
.toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track { position: absolute; inset: 0; background: var(--ln2); border-radius: 22px; transition: .2s; cursor: pointer; }
.toggle-track::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: var(--gy); border-radius: 50%; transition: .2s; }
input:checked ~ .toggle-track { background: var(--br); }
input:checked ~ .toggle-track::before { transform: translateX(18px); background: var(--on-br); }
input:focus-visible ~ .toggle-track { outline: 2px solid var(--lk); outline-offset: 2px; }

/* Input */
.input { background: var(--s); border: 1px solid var(--ln2); border-radius: 7px; padding: 8px 12px; color: var(--tx); font-size: 13px; outline: none; transition: border-color .15s; width: 100%; }
.input:focus { border-color: var(--lk); }

/* Focus */
:focus-visible { outline: 2px solid var(--lk); outline-offset: 2px; }

/* Animations */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .8s linear infinite; display: inline-block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn .2s ease; }

/* Notifications */
.notif-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 9999; min-width: 280px; max-width: 360px; }
.notif { padding: 11px 14px; border-radius: 8px; display: flex; align-items: center; gap: 9px; font-size: 13px; box-shadow: 0 4px 20px rgba(var(--sd-rgb),.5); animation: fadeIn .2s ease; }
.notif-ok  { background: var(--ok-bg); border: 1px solid rgba(var(--ok-rgb),.35); }
.notif-err { background: var(--er-bg); border: 1px solid rgba(var(--er-rgb),.35); }
.notif svg { width: 15px; height: 15px; flex-shrink: 0; }
.notif-ok svg  { color: var(--ok); }
.notif-err svg { color: var(--er); }

/* Empty state */
.empty { text-align: center; padding: 56px 32px; }
.empty svg { width: 44px; height: 44px; color: var(--su); margin-bottom: 16px; }
.empty h3 { font-size: 16px; font-weight: 600; color: var(--su); margin-bottom: 8px; }
.empty p { font-size: 13px; color: var(--su); }
.code-block { background: var(--term-b); border: 1px solid var(--term-ln); border-radius: 8px; padding: 14px 20px; display: inline-block; font-family: monospace; font-size: 13px; color: var(--term-t); text-align: left; margin-top: 20px; }

/* Project card */
.proj-card { background: var(--s); border: 1px solid var(--ln); border-radius: 10px; padding: 18px; transition: all .15s; }
.proj-card:hover { border-color: rgba(var(--br-rgb),0.4); }
.proj-card.active-proj { border-color: rgba(var(--br-rgb),0.55); background: rgba(var(--br-rgb),0.05); }

  }
}

/* ── Session token ───────────────────────────────────────────────────────── */
// `rkd gui` prints the URL with `?token=...`; kept in the URL (not stripped
// after reading it) so a page refresh or a duplicated tab keeps working.
const TOKEN = new URLSearchParams(location.search).get('token') || ''
const authError = ref(!TOKEN)

function wsUrl(path) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws'
  const sep = path.includes('?') ? '&' : '?'
  return `${proto}://${location.host}${path}${sep}token=${TOKEN}`
}

/* ── API ─────────────────────────────────────────────────────────────────── */
const api = {
  async get(p) {
    const r = await fetch('/api'+p, { headers: { 'X-RKD-Token': TOKEN } })
    if (r.status === 401) authError.value = true
    return r.json()
  },
  async post(p, b={}) {
    const r = await fetch('/api'+p, { method:'POST', headers:{'Content-Type':'application/json','X-RKD-Token':TOKEN}, body: JSON.stringify(b) })
    if (r.status === 401) authError.value = true
    return r.json()
  }
}

    helpModulesDesc: `Escanea el directorio <code style="color:var(--lk);font-size:11px;">addons/</code> y lista todos los módulos de Odoo con su versión y dependencias. La sección <b style="color:var(--tx);">Repositorios externos</b> muestra y edita <code style="color:var(--lk);font-size:11px;">gitman.yaml</code> — agrega, edita o elimina repos y luego dispara una reconstrucción de Docker para traer los cambios al contenedor.`,
    helpPackDesc: `Crea un ZIP portable de todo el entorno — código fuente, volcado de la base de datos y filestore — para compartir con un compañero. Quien lo recibe extrae el ZIP y ejecuta <b style="color:var(--tx);">Desempaquetar</b> para restaurarlo con un solo comando. Las claves SSH nunca se incluyen en el archivo.`,
    helpProjectsDesc: `Recorre el sistema de archivos para abrir proyectos Rocketdoo existentes. Cambiar de proyecto reinicia el servidor de la GUI en el nuevo directorio para que todas las pantallas reflejen el contexto seleccionado.`,
    helpServicesDesc: `<b style="color:var(--tx);">Mailpit</b> — activa o desactiva un servidor SMTP de pruebas. Odoo le envía los correos en vez de a un servidor real; abre <code style="color:var(--lk);font-size:11px;">localhost:8025</code> para inspeccionarlos. <b style="color:var(--tx);">Traefik</b> — configura un proxy inverso con HTTPS local o de producción, y obtén instrucciones para actualizar tu archivo hosts.`,
    helpSetupDesc: `<b style="color:var(--tx);">Scaffold</b> copia los archivos base de la plantilla (Dockerfile, docker-compose, odoo.conf…) al directorio actual. El <b style="color:var(--tx);">asistente de inicialización</b> te guía para elegir la versión de Odoo, la edición, los puertos, las claves SSH y los repos de terceros, y luego genera todas las plantillas.`,

    helpDashboardDesc: `Project overview (Odoo version, edition, PG, port) and a service table with status, image, ports and its own actions per row. The <b style="color:var(--tx);">Start</b> / <b style="color:var(--tx);">Stop</b> / <b style="color:var(--tx);">Build</b> buttons open a real-time terminal showing the full docker output.`,
    helpDeployDesc: `Deploy specific Odoo <b style="color:var(--tx);">modules</b> (not the full instance) to a configured VPS or Odoo.sh target. First configure a target with <b style="color:var(--tx);">Init</b>, then select modules and run a deployment. Supports dry-run, backups, and validation before pushing.`,
    helpInstancesDesc: `Deploy a full Odoo instance (Dockerfile + docker-compose + odoo.conf) to a remote VPS via SSH. Supports <b style="color:var(--tx);">stage</b> and <b style="color:var(--tx);">prod</b> environments, Docker or native deployment, and a dry-run mode to preview what will be sent before transferring any files.`,

    helpPackDesc: `Create a portable ZIP of the entire environment — source code, database dump, and filestore — to share with a teammate. The recipient extracts the ZIP and runs <b style="color:var(--tx);">Unpack</b> to restore it with a single command. SSH keys are never included in the archive.`,
    helpProjectsDesc: `Browse the filesystem to open existing Rocketdoo projects. Switching a project restarts the GUI server in the new directory so all views reflect the selected context.`,

function readLang() {
  try { return localStorage.getItem('rkd-lang') } catch (e) { return null }
}
function writeLang(value) {
  try { localStorage.setItem('rkd-lang', value) } catch (e) { /* private window, etc. */ }
}
function detectLang() {
  const nav = (navigator.language || '').toLowerCase()
  return nav.startsWith('es') ? 'es' : 'en'
}
const lang = ref(readLang() || detectLang())
document.documentElement.lang = lang.value
watch(lang, (value) => {
  writeLang(value)
  document.documentElement.lang = value
})
function toggleLang() {
  lang.value = lang.value === 'es' ? 'en' : 'es'
}
function t(key, vars) {
  const dict = L[lang.value] || L.en
  const value = dict[key] ?? L.en[key] ?? key
  if (!vars) return value
  return Object.keys(vars).reduce((acc, k) => acc.split('{'+k+'}').join(vars[k]), value)
}

let _nid = 0
function notify(msg, type='ok') {
  const id = ++_nid
  notifs.value.push({ id, msg, type })
  setTimeout(() => { notifs.value = notifs.value.filter(n=>n.id!==id) }, 4500)
}

function cstatus(s) {
  const v = (s||'').toLowerCase()
  if (v.includes('running')||v.includes(' up')) return 'running'
  if (v.includes('exited')||v.includes('stopped')) return 'stopped'
  if (v.includes('paused')) return 'paused'
  return 'unknown'
}
function dotClass(s) {
  const m = {running:'dot-green', stopped:'dot-red', paused:'dot-yellow'}
  return m[cstatus(s)] || 'dot-gray'
}
function statusBadgeClass(s) {
  const m = {running:'badge-green', stopped:'badge-red', paused:'badge-yellow'}
  return m[cstatus(s)] || 'badge-gray'
}
function statusVar(s) {
  const m = {running:'--ok', stopped:'--er', paused:'--wn'}
  return 'var(' + (m[cstatus(s)] || '--gy') + ')'
}
function statusLabel(s) {
  const v = cstatus(s)
  if (v === 'running') return t('statusRunning')
  if (v === 'stopped') return t('statusStopped')
  if (v === 'paused') return t('statusPaused')
  return t('statusUnknown')
}

/* ── Shared project/container context (RF11: the top bar reads this on every
   screen, not just the Dashboard) ──────────────────────────────────────── */
const proj = ref(null)
const ctrs = ref([])
const projBusy = ref(true)
// M7: `projBusy` used to gate the whole Dashboard/Containers content behind a `v-if`, so every
// background refresh (a row action, a project switch) unmounted `ServiceTable` — closing any
// open log viewer and its WebSocket. `projLoaded` gates that full-page spinner instead: true
// after the *first* successful load, so later refreshes keep the existing content mounted while
// they run, the same way `Modules`/`Instances`/etc. already behave with their own `busy`.
const projLoaded = ref(false)
const running = computed(() => ctrs.value.filter(c => cstatus(c.State||c.Status)==='running').length)
// I1: the primary-action toggle (top bar "Open Odoo" vs. the Dashboard's "Start All") has to
// track the container that actually serves Odoo, not the raw running count — with only `db`
// up, `running` is already 1 even though there is nothing listening on `odoo_port` yet.
const odooUp = computed(() => {
  const name = proj.value && proj.value.odoo_container
  const c = ctrs.value.find(c => name && c.Name === name) || ctrs.value.find(c => c.Service === 'web')
  return !!c && cstatus(c.State||c.Status) === 'running'
})
const moduleCount = ref(null)
const instanceCount = ref(null)

async function loadProjectContext() {
  projBusy.value = true
  try {
    const [p, c] = await Promise.all([api.get('/project'), api.get('/project/containers')])
    proj.value = p; ctrs.value = c.containers||[]
  } catch(e) { notify(t('loadFailed')+': '+e.message, 'err') }
  finally { projBusy.value = false; projLoaded.value = true }
}
async function loadNavCounts() {
  try { const r = await api.get('/modules'); moduleCount.value = (r.modules||[]).length } catch(e) { /* nav badge only */ }
  try { const r = await api.get('/instances'); instanceCount.value = (r.instances||[]).length } catch(e) { /* nav badge only */ }
}
function openOdoo() {
  if (proj.value && proj.value.odoo_port) window.open('http://localhost:'+proj.value.odoo_port, '_blank', 'noopener')
}

/* ══════════════════════════════════════════════════════════════════════════
   LOG VIEWER COMPONENT
══════════════════════════════════════════════════════════════════════════ */
const LogViewer = {
  props: { name: String },
  setup(props) {
    const lines = ref([])
    const live  = ref(false)
    const el    = ref(null)
    let ws      = null
    let pending = []
    let raf     = null

    function lineClass(l) {
      const lc = l.toLowerCase()
      if (/error|traceback|exception|critical/.test(lc)) return 'log-err'
      if (/warn/.test(lc)) return 'log-warn'
      return ''
    }

    function flush() {
      raf = null
      if (!pending.length) return
      lines.value.push(...pending.splice(0))
      if (lines.value.length > 1500) lines.value.splice(0, lines.value.length - 1300)
      nextTick(() => { if (el.value) el.value.scrollTop = el.value.scrollHeight })
    }

    function connect() {
      if (ws) ws.close()
      if (raf) { cancelAnimationFrame(raf); raf = null }
      pending = []
      lines.value = []
      live.value = true
      ws = new WebSocket(wsUrl(`/ws/logs/${props.name}`))
      ws.onmessage = e => {
        pending.push(e.data)
        if (!raf) raf = requestAnimationFrame(flush)
      }
      ws.onclose = () => {
        live.value = false
        if (raf) { cancelAnimationFrame(raf); raf = null }
        if (pending.length) flush()
      }
      ws.onerror = () => { live.value = false; lines.value.push(t('connectionError')) }
    }
    function stop() {
      if (raf) { cancelAnimationFrame(raf); raf = null }
      if (ws) ws.close()
      live.value = false
    }

    onMounted(connect)
    onUnmounted(stop)
    watch(() => props.name, connect)

    return { lines, live, el, connect, stop, lineClass, I }
  },
  template: `
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span style="font-size:12px;font-weight:600;color:var(--tx);">{{ name }}</span>
        <span v-if="live" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok);">
          <span class="dot dot-green" style="width:6px;height:6px;"></span> {{ $t('live') }}
        </span>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button @click="live?stop():connect()" class="btn btn-ghost btn-sm" v-html="(live?I.stop:I.play)+' '+(live?$t('stop'):$t('connect'))"></button>
          <button @click="lines=[]" class="btn btn-ghost btn-sm">{{ $t('clear') }}</button>
        </div>
      </div>
      <div ref="el" class="log-term">
        <div v-if="!lines.length" style="color:var(--term-t);font-style:italic;">{{ $t('waitingForOutput') }}</div>
        <div v-for="(l,i) in lines" :key="i" :class="lineClass(l)">{{ l }}</div>
      </div>
    </div>
  `
}

/* ══════════════════════════════════════════════════════════════════════════
   DOCKER TERMINAL — streaming WebSocket output for compose commands
══════════════════════════════════════════════════════════════════════════ */
const DockerTerminal = {
  props: { url: String, label: String },
  emits: ['done', 'close'],
  setup(props, { emit }) {
    const lines    = ref([])
    const running  = ref(true)
    const exitCode = ref(null)
    const el       = ref(null)
    let ws      = null
    let pending = []   // non-reactive line buffer
    let raf     = null // requestAnimationFrame handle

    // Flush the buffer into reactive state in one batch — max 60 updates/sec
    function flush() {
      raf = null
      if (!pending.length) return
      lines.value.push(...pending.splice(0))
      if (lines.value.length > 2000) lines.value.splice(0, lines.value.length - 1700)
      nextTick(() => { if (el.value) el.value.scrollTop = el.value.scrollHeight })
    }

    onMounted(() => {
      ws = new WebSocket(wsUrl(props.url))
      ws.onmessage = e => {
        const txt = e.data
        if (txt.startsWith('\x00exit:')) {
          // Drain any buffered lines before showing the exit banner
          if (raf) { cancelAnimationFrame(raf); raf = null }
          if (pending.length) flush()
          exitCode.value = parseInt(txt.slice(6))
          running.value  = false
          emit('done', exitCode.value)
        } else {
          if (txt.trim()) pending.push(txt)
          if (!raf) raf = requestAnimationFrame(flush)
        }
      }
      ws.onclose = () => {
        running.value = false
        if (raf) { cancelAnimationFrame(raf); raf = null }
        if (pending.length) flush()
        // Some server-side failures (missing query param, unhandled exception)
        // close the socket without ever sending the \x00exit: banner — without
        // this, callers waiting on @done would be stuck forever.
        if (exitCode.value === null) {
          exitCode.value = 1
          lines.value.push(t('connectionClosedUnexpectedly'))
          emit('done', 1)
        }
      }
      ws.onerror = () => {
        running.value = false
        lines.value.push(t('webSocketError'))
      }
    })
    onUnmounted(() => {
      if (raf) cancelAnimationFrame(raf)
      if (ws) ws.close()
    })

    function lineClass(l) {
      const lc = l.toLowerCase()
      if (/\berror\b|failed|traceback|exception|no such/.test(lc)) return 'log-err'
      if (/\bwarn(ing)?\b/.test(lc)) return 'log-warn'
      return ''
    }

    return { lines, running, exitCode, el, lineClass, I }
  },
  template: `
    <div class="card-flat" style="border-color:rgba(var(--br-rgb),0.2);">
      <div style="display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid var(--ln);background:var(--s);">
        <span v-if="running" v-html="I.spin" class="spin" style="width:13px;height:13px;color:var(--lk);display:inline-block;flex-shrink:0;"></span>
        <span v-else-if="exitCode===0" v-html="I.check" style="width:13px;height:13px;color:var(--ok);flex-shrink:0;"></span>
        <span v-else v-html="I.warn" style="width:13px;height:13px;color:var(--er);flex-shrink:0;"></span>
        <code style="font-size:12px;color:var(--tx);flex:1;font-family:monospace;">{{ label }}</code>
        <span v-if="running" style="font-size:11px;color:var(--mu);">{{ $t('runningEllipsis') }}</span>
        <span v-else-if="exitCode===0" style="font-size:11px;color:var(--ok);">{{ $t('completed') }}</span>
        <span v-else style="font-size:11px;color:var(--er);">{{ $t('exitCode', {code: exitCode}) }}</span>
        <button @click="$emit('close')" class="btn btn-ghost btn-sm" style="padding:2px 8px;margin-left:8px;" :title="$t('closeTerminal')" :aria-label="$t('closeTerminal')">✕</button>
      </div>
      <div ref="el" class="log-term" style="height:320px;">
        <div v-if="!lines.length" style="color:var(--term-t);font-style:italic;">{{ $t('connectingTo', {label: label}) }}</div>
        <div v-for="(l,i) in lines" :key="i" :class="lineClass(l)">{{ l }}</div>
      </div>
    </div>
  `
}

/* ══════════════════════════════════════════════════════════════════════════
   SERVICE TABLE — per-row status/image/ports/time + start/stop/restart/logs,
   shared by the Dashboard's project card and the Containers page so the two
   don't drift into two different row layouts for the same data.
══════════════════════════════════════════════════════════════════════════ */
const ServiceTable = {
  components: { LogViewer },
  props: { containers: { type: Array, default: () => [] } },
  emits: ['changed'],
  setup(props, { emit }) {
    const acts  = ref({})
    const logOf = ref(null)

    async function action(svc, cmd) {
      const key = svc+cmd; acts.value[key] = true
      try {
        const r = await api.post('/docker/service/'+cmd, { service: svc })
        if (r.ok) { notify(svc+': '+cmd); setTimeout(() => emit('changed'), 1500) }
        else notify(r.stderr||t('failed'),'err')
      } catch(e) { notify(e.message,'err') }
      finally { delete acts.value[key] }
    }

    return { acts, logOf, action, dotClass, statusBadgeClass, statusVar, statusLabel, I }
  },
  template: `
  <div style="overflow-x:auto;">
  <table class="table">
    <thead>
      <tr>
        <th>{{ $t('status') }}</th><th>{{ $t('service') }}</th><th>{{ $t('image') }}</th><th>{{ $t('ports') }}</th><th>{{ $t('time') }}</th><th style="text-align:right">{{ $t('actions') }}</th>
      </tr>
    </thead>
    <tbody>
      <template v-for="c in containers" :key="c.Name||c.Service">
        <tr>
          <td :style="{borderLeft: '3px solid ' + statusVar(c.State||c.Status)}">
            <span class="badge" :class="statusBadgeClass(c.State||c.Status)">
              <span class="dot" :class="dotClass(c.State||c.Status)" style="width:6px;height:6px;"></span>{{ statusLabel(c.State||c.Status) }}
            </span>
          </td>
          <td style="max-width:140px;">
            <div :title="c.Service||c.Name" style="font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ c.Service||c.Name }}</div>
            <div :title="c.Name" style="font-size:11px;color:var(--su);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ c.Name }}</div>
          </td>
          <td :title="c.Image||'—'" style="font-family:monospace;font-size:12px;color:var(--mu);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ (c.Image||'—').split('/').pop() }}</td>
          <td style="font-family:monospace;font-size:11px;color:var(--mu);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ c.Ports||'—' }}</td>
          <td :title="c.Status||'—'" style="font-size:11px;color:var(--su);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ c.Status||'—' }}</td>
          <td style="text-align:right;">
            <div style="display:flex;gap:5px;justify-content:flex-end;">
              <button @click="action(c.Service||c.Name,'start')" class="btn btn-ghost btn-sm" :title="$t('start')" :aria-label="$t('start')" :disabled="acts[(c.Service||c.Name)+'start']">
                <span v-html="acts[(c.Service||c.Name)+'start']?I.spin:I.play" :class="acts[(c.Service||c.Name)+'start']?'spin':''"></span>
              </button>
              <button @click="action(c.Service||c.Name,'stop')" class="btn btn-ghost btn-sm" :title="$t('stop')" :aria-label="$t('stop')" :disabled="acts[(c.Service||c.Name)+'stop']">
                <span v-html="acts[(c.Service||c.Name)+'stop']?I.spin:I.stop" :class="acts[(c.Service||c.Name)+'stop']?'spin':''"></span>
              </button>
              <button @click="action(c.Service||c.Name,'restart')" class="btn btn-ghost btn-sm" :title="$t('restart')" :aria-label="$t('restart')" :disabled="acts[(c.Service||c.Name)+'restart']">
                <span v-html="acts[(c.Service||c.Name)+'restart']?I.spin:I.restart" :class="acts[(c.Service||c.Name)+'restart']?'spin':''"></span>
              </button>
              <button @click="logOf=logOf===(c.Name||c.Service)?null:(c.Name||c.Service)"
                      class="btn btn-ghost btn-sm" :title="$t('logs')" :aria-label="$t('logs')"
                      :aria-expanded="logOf===(c.Name||c.Service)"
                      :style="logOf===(c.Name||c.Service)?'color:var(--lk);border-color:var(--lk);':''">
                <span v-html="I.logs"></span>
              </button>
            </div>
          </td>
        </tr>
        <tr v-if="logOf===(c.Name||c.Service)" :key="(c.Name||c.Service)+'-log'">
          <td colspan="6" style="background:var(--s);padding:14px 18px;">
            <LogViewer :name="c.Name||c.Service" />
          </td>
        </tr>
      </template>
    </tbody>
  </table>
  </div>`
}

/* ══════════════════════════════════════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════════════════════════════════════ */
const Dashboard = {
  components: { ServiceTable, DockerTerminal },
  setup() {
    const act        = ref('')
    const termAction = ref(null)

    function docker(cmd) {
      act.value      = cmd
      termAction.value = cmd
    }
    function onTermDone(code) {
      act.value = ''
      if (code === 0) {
        // Auto-close terminal then refresh — order matters: clear first to avoid remount loop
        setTimeout(() => { termAction.value = null; loadProjectContext() }, 1800)
      } else {
        // On failure keep terminal open so the user can read the error, but still refresh status
        setTimeout(loadProjectContext, 1000)
      }
    }
    function closeTerminal() {
      termAction.value = null
      act.value        = ''
      loadProjectContext()
    }

    onActivated(loadProjectContext)
    return {
      proj, ctrs, odooUp,
      busy: projBusy, loaded: projLoaded, act, termAction,
      load: loadProjectContext, docker, onTermDone, closeTerminal, I,
    }
  },
  template: `
  <div class="page fade-in">
    <div class="page-header">
      <div><div class="page-title">{{ $t('dashboardTitle') }}</div><div class="page-sub">{{ $t('dashboardSubtitle') }}</div></div>
      <button class="btn btn-ghost" @click="load" :disabled="busy">

    <div v-if="busy && !loaded" style="text-align:center;padding:80px 0;color:var(--mu);">

      <!-- No project -->
      <div v-if="!proj?.exists" class="card empty" style="border-style:dashed;">

      </div>

      <!-- Project card -->
      <div v-if="proj?.exists" style="margin-bottom:24px;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--su);margin-bottom:12px;">{{ $t('project') }}</div>
        <div class="card" style="border-color:rgba(var(--br-rgb),0.3);">
          <div style="margin-bottom:14px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
              <span v-html="I.rocket" style="width:18px;height:18px;color:var(--lk);flex-shrink:0;"></span>
              <span style="font-size:17px;font-weight:700;color:var(--tx);">{{ proj.project_name||$t('unnamedProject') }}</span>
            </div>
            <!-- Metadata strip: rarely-changing facts (version, edition, DB, port) as compact
                 tags instead of the four full-size stat cards this replaced (RF10). -->
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <span class="badge badge-blue">Odoo {{ proj.odoo_version }}</span>
              <span class="badge" :class="proj.odoo_edition==='Enterprise'?'badge-purple':'badge-gray'">{{ proj.odoo_edition }}</span>
              <span class="badge badge-gray" v-if="proj.db_version">PG {{ proj.db_version }}</span>
              <span class="badge badge-gray" v-if="proj.odoo_port">{{ $t('webPort') }} {{ proj.odoo_port }}</span>

          <!-- Services: the space the four stat cards freed up now goes here, since this is

      <!-- Quick actions: exactly one filled button here, and only when the top bar's "Open

    </template>

    <!-- Terminal lives OUTSIDE v-else so busy toggling never destroys/remounts it -->
    <div v-if="termAction" style="margin-top:20px;">
      <DockerTerminal :url="'/ws/docker/'+termAction" :label="'docker compose '+termAction" @done="onTermDone" @close="closeTerminal" />
    </div>
  </div>`
}

/* ══════════════════════════════════════════════════════════════════════════
   MODULES
══════════════════════════════════════════════════════════════════════════ */
const Modules = {
  components: { DockerTerminal },
  setup() {
    // ── Local addons ─────────────────────────────────────────────────────
    const mods     = ref([])
    const busy     = ref(true)
    const all      = ref(false)
    const q        = ref('')
    const filtered = computed(() => mods.value.filter(m =>
      !q.value || m.name.toLowerCase().includes(q.value.toLowerCase())
    ))

    async function load() {
      busy.value = true
      try {
        const r = await api.get('/modules?include_all='+all.value)
        mods.value = r.modules || []
        // Keep the nav badge meaning "installable modules" (loadNavCounts()'s own criterion) —
        // don't let toggling "show all" here silently redefine what the sidebar counts (M4).
        if (!all.value) moduleCount.value = mods.value.length
        if (r.error) notify(t('scanLabel')+': '+r.error, 'err')
      } catch(e) { notify(t('scanFailed'),'err') }
      finally { busy.value = false }
      loadGitman()
    }

    // ── Databases & module states ────────────────────────────────────────
    const dbs     = ref([])
    const dbError = ref('')
    const db      = ref('')
    const states  = ref({})

    async function loadDbs() {
      try {
        const r = await api.get('/odoo/databases')
        dbs.value = r.databases || []
        dbError.value = r.error || ''
      } catch(e) { dbs.value = []; dbError.value = e.message }
      let saved = null
      try { saved = localStorage.getItem('rkd-db') } catch (e) { /* private window, etc. */ }
      db.value = dbs.value.includes(saved) ? saved : (dbs.value[0] || '')
    }

    async function loadStates() {
      if (!db.value) { states.value = {}; return }
      try {
        const r = await api.get('/odoo/module-states?db='+encodeURIComponent(db.value))
        states.value = r.states || {}
        if (r.error) notify(t('moduleStatesLabel')+': '+r.error, 'err')
      } catch(e) { states.value = {} }
    }

    function stateOf(m) { return states.value[m.name] || '—' }
    function stateBadgeClass(s) {
      if (s === 'installed') return 'badge-green'
      if (s && s.startsWith('to ')) return 'badge-yellow'
      return 'badge-gray'
    }

    watch(db, v => {
      if (v) { try { localStorage.setItem('rkd-db', v) } catch (e) { /* private window, etc. */ } }
      loadStates()
    })

    // ── Module update ─────────────────────────────────────────────────────
    const updating = ref(null) // name of the module currently updating, or null
    const updateUrl   = computed(() => updating.value
      ? '/ws/odoo/update?module='+encodeURIComponent(updating.value)+'&db='+encodeURIComponent(db.value)
      : '')
    const updateLabel = computed(() => `odoo -u ${updating.value} -d ${db.value}`)

    function canUpdate(m) {
      return !!db.value && stateOf(m) === 'installed' && !updating.value
    }
    function updateReason(m) {
      if (updating.value) return t('updateReasonBusy')
      if (!db.value) return t('updateReasonNoDb')
      if (stateOf(m) !== 'installed') return t('updateReasonNotInstalled')
      return ''
    }
    function startUpdate(m) {
      if (!canUpdate(m)) return
      const ok = confirm(t('confirmModuleUpdate', { module: m.name, db: db.value }))
      if (!ok) return
      updating.value = m.name
    }
    async function onUpdateDone() {
      try {
        const r = await api.post('/docker/service/restart', { service: 'web' })
        notify(r.ok ? t('webRestarted') : (r.stderr || t('restartFailed')), r.ok ? 'ok' : 'err')
      } catch(e) { notify(e.message, 'err') }
      await loadStates()
      updating.value = null
    }

    // ── Gitman repos ──────────────────────────────────────────────────────
    const gitSources  = ref([])
    const gitOriginal = ref([])
    const gitExists   = ref(false)
    const gitBusy     = ref(false)
    const gitSaving   = ref(false)
    const rebuildBusy = ref(false)
    const gitForm     = ref(null)
    const gitDirty    = computed(() =>
      JSON.stringify(gitSources.value) !== JSON.stringify(gitOriginal.value)
    )

    async function loadGitman() {
      gitBusy.value = true
      try {
        const r = await api.get('/gitman')
        gitExists.value   = r.exists || false
        gitSources.value  = r.sources || []
        gitOriginal.value = JSON.parse(JSON.stringify(r.sources || []))
      } catch {}
      finally { gitBusy.value = false }
    }

    async function initGitman() {
      gitSaving.value = true
      try {
        const r = await api.post('/gitman', { sources: [] })
        if (r.ok) {
          gitExists.value   = true
          gitOriginal.value = []
          notify(t('gitmanYamlCreated'))
        } else notify(r.error || t('gitmanCreateFailed'), 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { gitSaving.value = false }
    }

    function addGitRepo() {
      gitForm.value = { idx: -1, name: '', repo: '', rev: '18.0', type: 'git' }
    }
    function editGitRepo(idx) {
      const s = gitSources.value[idx]
      gitForm.value = { idx, name: s.name, repo: s.repo, rev: s.rev, type: s.type }
    }
    function deleteGitRepo(idx) {
      gitSources.value.splice(idx, 1)
    }
    function autoName() {
      if (gitForm.value && !gitForm.value.name && gitForm.value.repo) {
        gitForm.value.name = gitForm.value.repo.split('/').pop().replace(/\.git$/, '')
      }
    }
    function confirmGitForm() {
      const f = gitForm.value
      if (!f.name.trim() || !f.repo.trim()) { notify(t('nameAndUrlRequired'),'err'); return }
      const entry = { name: f.name.trim(), repo: f.repo.trim(), rev: f.rev.trim() || 'main', type: 'git' }
      if (f.idx === -1) { gitSources.value.push(entry) }
      else              { gitSources.value[f.idx] = entry }
      gitForm.value = null
    }
    async function saveGitman() {
      gitSaving.value = true
      try {
        const r = await api.post('/gitman', { sources: gitSources.value })
        if (r.ok) {
          gitOriginal.value = JSON.parse(JSON.stringify(gitSources.value))
          notify(t('gitmanYamlSaved'))
        } else notify(r.error || t('saveFailed'), 'err')
      } catch(e) { notify(e.message,'err') }
      finally { gitSaving.value = false }
    }
    async function rebuildDocker() {
      rebuildBusy.value = true
      try {
        const r = await api.post('/docker/build')
        r.ok ? notify(t('buildCompleted')) : notify(r.stderr || t('buildFailed'),'err')
      } catch(e) { notify(e.message,'err') }
      finally { rebuildBusy.value = false; loadProjectContext() }
    }

    watch(all, load)
    onActivated(() => { load(); loadDbs() })
    return {
      mods, busy, all, q, filtered, load,
      dbs, dbError, db, stateOf, stateBadgeClass,
      updating, updateUrl, updateLabel, canUpdate, updateReason, startUpdate, onUpdateDone,
      gitSources, gitExists, gitBusy, gitSaving, rebuildBusy, gitForm, gitDirty,
      addGitRepo, editGitRepo, deleteGitRepo, autoName, confirmGitForm,
      saveGitman, rebuildDocker, initGitman, I
    }
  },
  template: `
  <div class="page fade-in">
    <div class="page-header">
      <div><div class="page-title">{{ $t('modulesTitle') }}</div><div class="page-sub">{{ $t('modulesSubtitle') }}</div></div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div v-if="dbs.length" style="display:flex;align-items:center;gap:6px;">
          <label style="font-size:11px;color:var(--mu);">{{ $t('dbLabel') }}</label>
          <select v-model="db" class="input" style="width:auto;padding:5px 8px;font-size:12px;">
            <option v-for="d in dbs" :key="d" :value="d">{{ d }}</option>

    <template v-else>

      <div v-if="gitBusy" style="text-align:center;padding:36px 0;color:var(--mu);">

      </template>
    </div>
  </div>`
}

const Instances = {

      finally { busy.value = false }

      try {
        const r = await api.post('/instances/deploy', { env, dry_run: !!dry.value[env] })

  },

══════════════════════════════════════════════════════════════════════════ */
const Services = {
  setup() {
    const mail = ref({ enabled:false, running:false })
    const traefik = ref({ enabled:false, mode:null, domain:null, override_exists:false })
    const busy = ref(true)
    const mailBusy = ref(false)
    const traefikBusy = ref(false)

    async function load() {
      busy.value = true
      try {
        const [m,t] = await Promise.all([api.get('/mail/status'), api.get('/traefik/status')])
        mail.value = m; traefik.value = t
      } catch(e) { notify(t('loadFailed'),'err') }
      finally { busy.value = false }
    }

    async function toggleMail() {
      mailBusy.value = true
      try {
        const r = await api.post(mail.value.enabled ? '/mail/off' : '/mail/on')

const Deploy = {
  setup() {
    const targets    = ref([])
    const busy       = ref(true)
    const depBusy    = ref({})
    const valBusy    = ref(false)
    const validation = ref(null)
    const output     = ref('')
    const hasConfig  = ref(false)
    const initForm   = ref({ target_name:'production', target_type:'vps', host:'', user:'ubuntu', ssh_port:22, ssh_key:'', deployment_type:'docker', force:false })
    const initBusy   = ref(false)

    async function load() {
      busy.value = true
      try {
        const [t,c] = await Promise.all([api.get('/deploy/targets'), api.get('/deploy/config')])
        targets.value = t.targets||[]; hasConfig.value = c.exists
      } catch { notify(t('loadFailed'),'err') }
      finally { busy.value = false }
    }
    async function deployTarget(target, dry_run=false) {
      const k = target+dry_run; depBusy.value[k] = true; output.value = ''
      try {
        const r = await api.post('/deploy/run', { target, dry_run, modules:[], skip_backup:false, skip_validation:false })
        output.value = r.ok ? '✓ '+(dry_run?t('dryRunPrefixOutput'):'')+t('deployDoneOutput')+(r.result||r.message||'') : '✗ '+r.error
        r.ok ? notify(dry_run ? t('dryRunTargetDone', { target: target }) : t('deployTargetDone', { target: target })) : notify(r.error||t('failed'),'err')
      } catch(e) { notify(e.message,'err'); output.value = '✗ '+e.message }
      finally { delete depBusy.value[k] }
    }
    async function validate() {
      valBusy.value = true; validation.value = null
      try {
        const r = await api.post('/deploy/validate')
        validation.value = r
        r.ok ? notify(t('allModulesValid', {count: r.total})) : notify(t('validationErrorsFound'),'err')
      } catch(e) { notify(e.message,'err') }
      finally { valBusy.value = false }
    }
    async function initDeploy() {
      initBusy.value = true
      try {
        const r = await api.post('/deploy/init', { ...initForm.value, ssh_port: Number(initForm.value.ssh_port) })
        if (r.ok) { notify(t('deployYamlCreated')); await load() }
        else notify(r.error||t('failed'),'err')
      } catch(e) { notify(e.message,'err') }
      finally { initBusy.value = false }
    }
    onActivated(load)
    return { targets, busy, depBusy, valBusy, validation, output, hasConfig, initForm, initBusy, load, deployTarget, validate, initDeploy, I }
  },

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">

        <span style="font-size:14px;font-weight:600;color:var(--tx);">{{ validation.ok ? $t('allModulesValid', {count: validation.total}) : $t('validationErrors') }}</span>

const Pack = {
  setup() {
    const status       = ref({ project_exists: false, shared_json_found: false })
    const packForm     = ref({ include_db: true, output_path: '', db_name: '' })
    const packBusy     = ref(false)
    const unpackBusy   = ref(false)
    const output       = ref('')
    const busy         = ref(true)
    const showUnpackWizard = ref(false)
    const unpackInfo   = ref({ meta: {}, ssh_keys: [], shared_json_found: false })
    const unpackForm   = ref({ use_ssh: false, ssh_key: '' })
    const loadingInfo  = ref(false)

    async function load() {
      busy.value = true
      try { const r = await api.get('/pack/status'); status.value = r }
      catch {} finally { busy.value = false }
    }
    async function pack() {
      packBusy.value = true; output.value = ''
      try {
        const body = { include_db: packForm.value.include_db }
        if (packForm.value.output_path) body.output_path = packForm.value.output_path
        if (packForm.value.db_name) body.db_name = packForm.value.db_name
        const r = await api.post('/pack/pack', body)
        output.value = [r.stdout, r.stderr].filter(Boolean).join('\n')
        r.ok ? notify(t('packCompleted')) : notify(r.stderr||t('packFailed'),'err')
        if (r.ok) await load()
      } finally { packBusy.value = false }
    }
    async function openUnpackWizard() {
      loadingInfo.value = true; showUnpackWizard.value = true; output.value = ''
      try {
        const r = await api.get('/pack/unpack-info')
        unpackInfo.value = r
        unpackForm.value.use_ssh = !!(r.meta && r.meta.uses_private_repos)
        unpackForm.value.ssh_key = (r.ssh_keys && r.ssh_keys.length) ? r.ssh_keys[0] : ''
      } catch { notify(t('unpackInfoLoadFailed'),'err') }
      finally { loadingInfo.value = false }
    }
    async function runUnpack() {
      unpackBusy.value = true; output.value = ''
      try {
        const body = {
          use_ssh: unpackForm.value.use_ssh,
          ssh_key: (unpackForm.value.use_ssh && unpackForm.value.ssh_key) ? unpackForm.value.ssh_key : null,
        }
        const r = await api.post('/pack/unpack', body)
        output.value = [r.stdout, r.stderr].filter(Boolean).join('\n')
        r.ok ? notify(t('unpackCompleted')) : notify(r.stderr||t('unpackFailed'),'err')
        if (r.ok) { showUnpackWizard.value = false; await load(); loadProjectContext() }
      } finally { unpackBusy.value = false }
    }
    onActivated(load)
    return { status, packForm, packBusy, unpackBusy, output, busy,
             showUnpackWizard, unpackInfo, unpackForm, loadingInfo,
             pack, openUnpackWizard, runUnpack, I }
  },

/* ══════════════════════════════════════════════════════════════════════════
   PROJECTS — Discover, navigate & create Rocketdoo projects
══════════════════════════════════════════════════════════════════════════ */
const Projects = {
  setup() {
    const projects   = ref([])
    const busy       = ref(false)
    const scanDir    = ref('')
    const newName    = ref('')
    const createBusy = ref(false)
    const navBusy    = ref({})
    const editing    = ref(false)
    const customPath = ref('')
    const scanned    = ref(false)

    async function loadWorkspace() {
      try {
        const r = await api.get('/workspace')
        currentPath.value = r.path
        customPath.value = r.path
        if (!scanDir.value) scanDir.value = r.default_scan
      } catch {}
    }

    async function discover() {
      busy.value = true; scanned.value = false
      try {
        const r = await api.post('/workspace/discover', { base_dir: scanDir.value, max_depth: 3 })
        projects.value = r.projects || []
        scanned.value = true
        if (r.error) notify(r.error, 'err')
        else if (r.total > 0) notify(t('projectsFoundCount', {count: r.total}))
        else notify(t('noProjectsFoundInDir', {dir: r.base_dir}), 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { busy.value = false }
    }

    async function navigate(path) {
      navBusy.value[path] = true
      try {
        const r = await api.post('/workspace/navigate', { path })
        if (r.ok) {
          currentPath.value = r.path
          customPath.value = r.path
          projects.value = projects.value.map(p => ({ ...p, is_current: p.path === r.path }))
          notify(t('projectOpenedSwitching', { name: r.name }))
          setTimeout(() => { view.value = 'dashboard' }, 400)
        } else notify(r.error || t('failedToOpenProject'), 'err')
      } catch(e) { notify(e.message, 'err') }
      finally { navBusy.value[path] = false }
    }

    async function navigateCustom() {
      if (!customPath.value.trim()) return
      editing.value = false
      await navigate(customPath.value.trim())
    }

    async function createProject() {
      const name = newName.value.trim()
      if (!name) { notify(t('projectNameRequired'), 'err'); return }
      createBusy.value = true
      try {
        const mkr = await api.post('/workspace/mkdir', { name, base_dir: scanDir.value })
        if (!mkr.ok) { notify(mkr.error || t('failedToCreateDirectory'), 'err'); return }
        const navr = await api.post('/workspace/navigate', { path: mkr.path })
        if (navr.ok) { currentPath.value = navr.path; customPath.value = navr.path }
        notify(t('createdOpeningSetup', { name: mkr.name }))
        newName.value = ''
        // Small delay so the notify is visible before switching
        setTimeout(() => { view.value = 'setup' }, 600)
      } catch(e) { notify(e.message, 'err') }
      finally { createBusy.value = false }
    }

    onMounted(async () => {
      await loadWorkspace()
      discover()
    })

    return {
      projects, busy, scanDir, newName, createBusy, navBusy,
      editing, customPath, scanned, currentPath,
      navigate, navigateCustom, createProject, discover, I
    }
  },

const App = {
  components: { Projects, Dashboard, Containers, Modules, Instances, Services, Setup, Deploy, Pack, Help },
  setup() {
    // Grouped nav (RF11/T5): Project / Environment / Publish, with item counts where the count
    // means something on its own (containers, modules, instances). Help stays outside every
    // group, pinned below a separator.
    const navGroups = computed(() => [
      { label: t('navGroupProject'), items: [
          { id:'projects',  label:t('navProjects'),  icon: I.compass   },
          { id:'dashboard', label:t('navDashboard'), icon: I.dashboard },
          { id:'setup',     label:t('navSetup'),     icon: I.setup     },
      ]},
      { label: t('navGroupEnvironment'), items: [
          { id:'containers', label:t('navContainers'), icon: I.containers, count: ctrs.value.length },
          { id:'modules',    label:t('navModules'),    icon: I.modules,    count: moduleCount.value  },
          { id:'instances',  label:t('navInstances'),  icon: I.instances,  count: instanceCount.value },
          { id:'services',   label:t('navServices'),   icon: I.services    },
      ]},
      { label: t('navGroupPublish'), items: [
          { id:'deploy', label:t('navDeploy'), icon: I.deploy },
          { id:'pack',   label:t('navPack'),   icon: I.pack   },
      ]},
    ])
    const viewMap = {
      projects:'Projects', dashboard:'Dashboard', containers:'Containers',
      modules:'Modules', instances:'Instances', services:'Services',
      deploy:'Deploy', setup:'Setup', pack:'Pack', help:'Help'
    }

    // Read from the server: hardcoding it here left the sidebar showing
    // 3.0.0 long after the package had moved on.
    const rkdVersion = ref('')
    onMounted(async () => {
      try { rkdVersion.value = (await api.get('/version')).version || '' } catch (e) { }
    })
    // No stored choice: follow the system theme via the `prefers-color-scheme` block and
    // never stamp `data-theme` at all. Stamping only happens once the button is used, so a
    // system-theme change while the GUI is open still shows up for anyone who never chose.
    function readTheme() {
      try { return localStorage.getItem('rkd-theme') } catch (e) { return null }
    }
    function writeTheme(value) {
      try { localStorage.setItem('rkd-theme', value) } catch (e) { /* private window, etc. */ }
    }
    const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null
    let storedTheme = readTheme()
    function currentDarkMode() {
      return storedTheme ? storedTheme === 'dark' : !!(systemDark && systemDark.matches)
    }
    const darkMode = ref(currentDarkMode())
    function applyTheme() {
      if (storedTheme) document.documentElement.setAttribute('data-theme', storedTheme)
      else document.documentElement.removeAttribute('data-theme')
      darkMode.value = currentDarkMode()
    }
    function toggleTheme() {
      storedTheme = darkMode.value ? 'light' : 'dark'
      writeTheme(storedTheme)
      applyTheme()
    }

    async function init() {
      try {
        const r = await api.get('/workspace')
        currentPath.value = r.path
      } catch {}
    }

    // B1: the top bar and the nav counters read module-level state that used to live inside
    // whichever screen displayed it — a stale value was invisible because the owning screen
    // refreshed it on every activation. Now that it is a permanent header, a project switch
    // has to refresh it explicitly. `oldPath` is falsy only for the very first assignment
    // (done by `init()` below), which `onMounted` already covers directly — this only reacts to
    // a *second* value, i.e. an actual switch (Projects.navigate/createProject, or editing the
    // path by hand), wherever it happens outside the Dashboard/Containers activation this relied
    // on before.
    watch(currentPath, (newPath, oldPath) => {
      if (!oldPath) return
      loadProjectContext()
      loadNavCounts()
    })

    onMounted(() => {
      applyTheme()
      if (systemDark) {
        const onSystemChange = () => { if (!storedTheme) darkMode.value = currentDarkMode() }
        if (systemDark.addEventListener) systemDark.addEventListener('change', onSystemChange)
        else if (systemDark.addListener) systemDark.addListener(onSystemChange)
      }
      if (authError.value) return
      init()
      loadProjectContext()
      loadNavCounts()
    })
    return {
      view, navGroups, notifs, I, viewMap, currentPath, darkMode, toggleTheme, rkdVersion,
      authError, lang, toggleLang, proj, ctrs, running, odooUp, openOdoo,
    }
  },
  template: `
  <div v-if="authError" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="card" style="max-width:460px;text-align:center;">
      <span v-html="I.warn" style="width:32px;height:32px;color:var(--wn);display:inline-block;margin-bottom:12px;"></span>
      <h2 style="font-size:16px;margin-bottom:8px;">{{ $t('sessionTokenRequired') }}</h2>
      <p style="color:var(--mu);font-size:13px;line-height:1.6;" v-html="$t('sessionTokenRequiredDesc')">
      </p>
    </div>
  </div>
  <div v-else class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon">
          <span v-html="I.rocket" style="width:18px;height:18px;color:var(--on-br);"></span>
        </div>
        <div>
          <div class="logo-text">RKD <span class="v3-badge">{{ rkdVersion ? 'v'+rkdVersion : 'v3' }}</span></div>
          <div class="logo-sub">Rocketdoo</div>
        </div>
      </div>

      <!-- Active path pill -->
      <button type="button" v-if="currentPath" class="active-path" @click="view='projects'" :title="$t('clickToManageProjects')" :aria-label="$t('manageProjects')">
        <div class="active-path-label">{{ $t('workingDir') }}</div>
        <div class="active-path-val">{{ currentPath.split('/').slice(-2).join('/') || currentPath }}</div>
      </button>

      <nav class="nav" :aria-label="$t('mainNavigation')">
        <div v-for="g in navGroups" :key="g.label" role="group" :aria-label="g.label">
          <div class="nav-group-label">{{ g.label }}</div>
          <button type="button" v-for="n in g.items" :key="n.id"
               class="nav-item" :class="{ active: view===n.id }"
               :aria-current="view===n.id ? 'page' : null"
               @click="view=n.id">
            <span v-html="n.icon"></span>
            <span style="flex:1;text-align:left;">{{ n.label }}</span>
            <span v-if="n.count" class="nav-count">{{ n.count }}</span>
          </button>
        </div>
        <div class="nav-sep"></div>
        <button type="button" class="nav-item" :class="{ active: view==='help' }"
             :aria-current="view==='help' ? 'page' : null" @click="view='help'">
          <span v-html="I.help"></span>
          <span style="flex:1;text-align:left;">{{ $t('navHelp') }}</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div style="color:var(--su);margin-bottom:8px;">Rocketdoo<span v-if="rkdVersion"> v{{ rkdVersion }}</span></div>
        <a href="https://rkd-docs.readthedocs.io" target="_blank"
           style="color:var(--lk);text-decoration:none;font-size:11px;display:inline-flex;align-items:center;gap:4px;">
          <span v-html="I.ext" style="width:10px;height:10px;"></span> {{ $t('documentation') }}
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Top bar (RF11): project context + running-containers pill on every screen, plus the
           one action that matters everywhere (Open Odoo) and the language/theme toggles moved
           here from the sidebar footer (T4 review M11). -->
      <header class="topbar">
        <div class="topbar-context">
          <span v-html="I.folder" style="width:16px;height:16px;color:var(--lk);flex-shrink:0;"></span>
          <div class="topbar-name" :title="currentPath" style="min-width:0;">{{ proj?.exists ? (proj.project_name || $t('unnamedProject')) : (currentPath ? currentPath.split('/').filter(Boolean).pop() : '…') }}</div>
          <span v-if="proj?.exists" class="badge badge-gray" style="flex-shrink:0;">
            {{ $t('activeContainersPill', {running: running, total: ctrs.length}) }}
          </span>
        </div>
        <div class="topbar-actions">
          <button type="button" v-if="proj?.exists && proj.odoo_port" @click="openOdoo"
                  :class="odooUp ? 'btn btn-primary btn-sm' : 'btn btn-ghost btn-sm'"
                  :disabled="!odooUp" :title="odooUp ? null : $t('odooNotRunning')">
            <span v-html="I.ext"></span> {{ $t('openOdoo') }}
          </button>
          <button type="button" @click="toggleLang" class="btn btn-ghost btn-sm"
                  :title="$t('switchLanguage', {code: lang==='es' ? 'EN' : 'ES'})"
                  :aria-label="$t('switchLanguage', {code: lang==='es' ? 'EN' : 'ES'})">
            <span v-html="I.globe" style="width:13px;height:13px;display:block;"></span>
            <span style="font-size:11px;font-weight:700;">{{ lang==='es' ? 'EN' : 'ES' }}</span>
          </button>
          <button type="button" @click="toggleTheme" class="btn btn-ghost btn-sm"
                  :title="darkMode ? $t('switchToLightMode') : $t('switchToDarkMode')"
                  :aria-label="darkMode ? $t('switchToLightMode') : $t('switchToDarkMode')">
            <span v-html="darkMode ? I.sun : I.moon" style="width:14px;height:14px;display:block;"></span>
          </button>
        </div>
      </header>
      <keep-alive>
        <component :is="viewMap[view]||'Projects'"></component>
      </keep-alive>
    </main>

    <!-- Notifications -->
    <div class="notif-wrap">
      <div v-for="n in notifs" :key="n.id" class="notif" :class="n.type==='err'?'notif-err':'notif-ok'">
        <span v-html="n.type==='err'?I.warn:I.check"></span>
        {{ n.msg }}
      </div>
    </div>
  </div>`
}

const app = createApp(App)
app.config.globalProperties.$t = t
app.mount('#app')
</script>
</body>
